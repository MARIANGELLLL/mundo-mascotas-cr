name: Despliegue Continuo a InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Obtener código
        uses: actions/checkout@v4

      - name: Subir archivos a InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          local-dir: ./
          protocol: ftp
          port: 21
